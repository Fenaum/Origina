[pytest]
# ──────────────────────────────────────────────────────────────────────────────
# Origina backend pytest configuration — see ROADMAP.md "Testing Checkpoints"
# Section A.1. Tests run against the existing dev Postgres (originadb) using
# a per-test-run schema for isolation. No external testcontainers required.
# ──────────────────────────────────────────────────────────────────────────────

testpaths = tests/backend
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto

# Markers — register new ones here as the suite grows.
markers =
    smoke: fast smoke tests that hit only /health, /, /docs (no DB)
    integration: tests that touch the database
    slow: tests that take >2s (seed-heavy, full pipeline)

# Coverage defaults (extend in CI)
addopts =
    -ra
    --strict-markers
    --tb=short