name: CI

on:
  push:
    branches: [main, feature/**, sprint-**]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch / PR so we don't burn CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────
  backend:
    name: Backend tests + coverage gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: originadb
          POSTGRES_USER: origina
          POSTGRES_PASSWORD: origina123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://origina:origina123@localhost:5432/originadb
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize database schema
        run: bash scripts/db_init.sh

      - name: Run backend tests with coverage gates
        # Sprint 5 §5.2 — same entry point as local runs. Enforces both gates:
        #   app.api + app.services ≥ 70%, condition_lifecycle ≥ 90%.
        run: ./scripts/run_tests.sh backend

  # ── Frontend ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend lint + type check + tests + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: cd src/frontend && npm ci

      - name: Lint
        run: cd src/frontend && npm run lint

      - name: TypeScript check
        run: cd src/frontend && npx tsc --noEmit

      - name: Vitest suite
        run: ./scripts/run_tests.sh frontend

      - name: Build check
        run: cd src/frontend && npm run build
